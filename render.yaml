services:
  - type: web
    name: efootball-tournament
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://efootball2026.online,https://www.efootball2026.online
